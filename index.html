<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do you love me?</title>
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    } 

    body { 
      min-height: 100vh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      background: linear-gradient(135deg, #ffe6ea 0%, #ffc0cb 100%); 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      overflow: hidden;
      position: relative;
    } 

    /* Background Canvas for Floating Hearts */
    #heartCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .card { 
      text-align: center; 
      background: rgba(255, 255, 255, 0.85); 
      backdrop-filter: blur(15px);
      padding: 40px 30px; 
      border-radius: 24px; 
      box-shadow: 0 20px 40px rgba(233, 30, 99, 0.2); 
      max-width: 400px;
      width: 90%;
      position: relative;
      z-index: 2;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.4);
    } 

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 25px 50px rgba(233, 30, 99, 0.25);
    }

    /* Interactive Heart Icon Container */
    .image-container {
      position: relative;
      width: 130px;
      height: 130px;
      margin: 0 auto 25px;
    }

    img { 
      width: 100%; 
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      box-shadow: 0 8px 24px rgba(233, 30, 99, 0.2);
    } 

    /* Heart pulse effect */
    .pulse-glow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(233, 30, 99, 0.2);
      animation: pulse 2s infinite;
      z-index: -1;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    h1 { 
      color: #d81b60; 
      font-size: 26px;
      margin-bottom: 35px; 
      font-weight: 700;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.05);
    } 

    .buttons { 
      position: relative;
      width: 100%;
      height: 80px;
      margin: 0 auto;
    } 

    button { 
      padding: 14px 32px; 
      font-size: 16px; 
      font-weight: 700; 
      border: none; 
      border-radius: 30px; 
      cursor: pointer; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
    } 

    #yesBtn { 
      background-color: #e91e63; 
      color: white; 
      position: absolute;
      left: 20px;
      top: 10px;
      z-index: 10;
    } 

    #yesBtn:hover {
      background-color: #c2185b;
      box-shadow: 0 6px 20px rgba(233, 30, 99, 0.4);
    }

    #noBtn { 
      background-color: #757575; 
      color: white; 
      position: absolute; 
      transition: 0.2s ease;
    }

    /* Celebration Screen */
    .celebration {
      display: none;
      animation: fadeIn 0.8s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .celebration h1 {
      font-size: 30px;
      color: #d81b60;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <!-- Animated Background Matrix -->
  <canvas id="heartCanvas"></canvas>

  <div class="card" id="card">
    <div id="questionScreen">
      <div class="image-container">
        <div class="pulse-glow"></div>
        <img src="WhatsApp Image 2026-10-29 at 4.08.44 PM.jpeg" alt="Cute Heart">
      </div>
      <h1>Do you love me?</h1>
      <div class="buttons">
        <button id="yesBtn">Yes!</button>
        <button id="noBtn">No</button>
      </div>
    </div>

    <div id="celebrationScreen" class="celebration">
      <div class="image-container">
        <img src="WhatsApp Image 2026-10-29 at 4.13.10 PM.jpeg" alt="Flowers">
      </div>
      <h1>I love you more! ❤️</h1>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const questionScreen = document.getElementById('questionScreen');
    const celebrationScreen = document.getElementById('celebrationScreen');
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');

    let yesScale = 1;

    // Set canvas dimensions
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Floating background hearts particle class
    class HeartParticle {
      constructor() {
        this.reset();
        this.y = Math.random() * canvas.height; 
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + 20;
        this.size = Math.random() * 15 + 10;
        this.speed = Math.random() * 1.5 + 0.5;
        this.opacity = Math.random() * 0.5 + 0.2;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = '#ff4081';
        ctx.beginPath();
        // Path creation for a clean canvas heart shape
        ctx.moveTo(this.x, this.y + this.size / 4);
        ctx.quadraticCurveTo(this.x, this.y, this.x - this.size / 2, this.y);
        ctx.quadraticCurveTo(this.x - this.size, this.y, this.x - this.size, this.y + this.size / 2);
        ctx.quadraticCurveTo(this.x - this.size, this.y + (this.size * 3) / 4, this.x, this.y + this.size);
        ctx.quadraticCurveTo(this.x + this.size, this.y + (this.size * 3) / 4, this.x + this.size, this.y + this.size / 2);
        ctx.quadraticCurveTo(this.x + this.size, this.y, this.x + this.size / 2, this.y);
        ctx.quadraticCurveTo(this.x, this.y, this.x, this.y + this.size / 4);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      update() {
        this.y -= this.speed;
        if (this.y < -20) this.reset();
      }
    }

    const heartsArray = Array.from({ length: 30 }, () => new HeartParticle());

    function animateBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      heartsArray.forEach(heart => {
        heart.update();
        heart.draw();
      });
      requestAnimationFrame(animateBackground);
    }
    animateBackground();

    // Move "No" button smoothly away and make "Yes" grow to cover options!
    function dodgeNoButton() {
      const cardRect = document.getElementById('card').getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      // Maintain padding safe spaces
      const maxX = cardRect.width - btnRect.width - 30;
      const maxY = cardRect.height - btnRect.height - 30;

      const randomX = Math.floor(Math.random() * maxX);
      const randomY = Math.floor(Math.random() * maxY);

      noBtn.style.position = 'absolute';
      noBtn.style.left = `${randomX}px`;
      noBtn.style.top = `${randomY}px`;

      // Psychological trick: grow the Yes button bigger over time!
      yesScale += 0.15;
      yesBtn.style.transform = `scale(${yesScale})`;
    }

    noBtn.addEventListener('mouseenter', dodgeNoButton);
    noBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      dodgeNoButton();
    });

    // Intense Confetti Burst Effect on Acceptance
    function triggerConfettiBlast() {
      for(let i = 0; i < 70; i++) {
        const confetti = new HeartParticle();
        confetti.x = window.innerWidth / 2;
        confetti.y = window.innerHeight / 2;
        confetti.speed = Math.random() * 8 + 4;
        confetti.angle = Math.random() * Math.PI * 2;
        confetti.opacity = 1;
        
        // Override update logic for explosion physics
        confetti.update = function() {
          this.x += Math.cos(this.angle) * this.speed;
          this.y += Math.sin(this.angle) * this.speed;
          this.speed *= 0.95; // friction
          this.opacity -= 0.015;
        };
        confetti.draw = function() {
          if (this.opacity <= 0) return;
          ctx.save();
          ctx.globalAlpha = this.opacity;
          ctx.fillStyle = `hsl(${Math.random() * 40 + 330}, 100%, 65%)`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, Math.random() * 6 + 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        };
        heartsArray.push(confetti);
      }
    }

    // Toggle Celebration State
    yesBtn.addEventListener('click', () => {
      questionScreen.style.display = 'none';
      celebrationScreen.style.display = 'block';
      triggerConfettiBlast();
    });
  </script>

</body>
</html>
