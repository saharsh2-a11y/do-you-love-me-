<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A sweet love letter page with playful animation and a romantic message."
    />
    <title>Do You Love Me? ❤️</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="rose-petal" aria-hidden="true">🌹</div>
    <div class="rose-petal rose-petal--second" aria-hidden="true">🌹</div>

    <main class="card" aria-live="polite">
      <div class="img-container">
        <img
          src="WhatsApp Image 2026-10-29 at 4.08.44 PM.jpeg"
          alt="A romantic proposal illustration"
          id="cardImg"
        />
      </div>

      <h1 id="question">Do you love me? ❤️</h1>

      <div class="buttons" aria-label="Answer choices">
        <button id="yesBtn" type="button">YES</button>
        <button id="noBtn" type="button" aria-label="No">NO</button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
