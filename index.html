<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Do You Love Me? ❤️</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="sparkles" aria-hidden="true"></div>
    <div class="romantic-pattern" aria-hidden="true"></div>

    <div class="background-gallery" aria-hidden="true">
      <div class="polaroid p1"></div>
      <div class="polaroid p2"></div>
      <div class="polaroid p3"></div>
      <div class="polaroid p4"></div>
      <div class="polaroid p5"></div>
    </div>

    <div class="container">
      <div class="card-stack">
        <div class="card main-card" id="mainCard" aria-live="polite">
          <div class="image-frame">
            <img
              src="WhatsApp Image 2026-10-29 at 4.08.44 PM.jpeg"
              alt="Cute romantic moment"
              class="main-image"
            />
            <img
              src="WhatsApp Image 2026-10-29 at 4.13.10 PM.jpeg"
              alt="Happy romantic celebration"
              class="celebration-image"
            />
          </div>

          <h1 id="question">Do you love me? ❤️</h1>

          <div class="love-note" id="loveNote">
            You are my favorite person, my forever, and my happy place 💖
          </div>

          <div class="buttons-row">
            <div class="buttons">
              <button id="yesBtn" type="button">YES</button>
              <button id="noBtn" type="button">NO</button>
            </div>
            <button id="musicBtn" class="music-btn" type="button" aria-label="Toggle background music">
              ♫ Music
            </button>
          </div>
        </div>

        <div class="card love-card" id="loveCard" hidden>
          <div class="love-card-header">My Love Letter 💌</div>
          <p id="loveMessage"></p>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
